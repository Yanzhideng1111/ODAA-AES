# Convert your licensed TOEFL11 TSV/CSV into columns essay_id, prompt_id, essay, score.
# score must be Low, Medium, High or numerical 0,0.5,1.
model:
  backbone: microsoft/deberta-v3-base
  max_tokens: 384
  overlap: 64
  max_segments: 6
  truncation: first
  hidden_size: 256
  dropout: 0.20
  num_anchors: 5
  sigma: 0.15
  anchor_strategy: uniform
  anchors: null
  gpaa: true
  ocaa: true
  ospl: true
  conditioning: ordinal
  anchor_mass_normalize: false
training:
  seed: 42
  seeds: [42, 43, 44, 45, 46]
  batch_size: 8
  accumulation_steps: 4
  epochs: 20
  lr_backbone: 0.00002
  lr_new: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.10
  grad_clip: 1.0
  alpha: 0.20
  beta: 0.20
  gamma: 0.10
  ordinal_distance_weight: 1.0
  ordinal_margin: 0.5
  huber_delta: 1.0
  pair_mode: balanced
  max_pairs: 128
  min_delta_score: 0.000001
  ties_in_distance: true
  num_workers: 0
  amp: true
  progress_log_every: 20
  hyperparam_grid:
    - {alpha: 0.20, beta: 0.20, gamma: 0.10}
  checkpoint_strategy: median_best_epoch
  rounding: half_away_from_zero
  score_transform: minmax
  inner_max_folds: null
  eval_batch_size: 8
data:
  text_col: essay
  id_col: essay_id
  prompt_col: prompt_id
  score_col: score
  genre_col: null
  sep: ','
  # For every distinct TOEFL11 prompt ID, use the same 0..1 three-level rubric.
  default_score_spec: {min: 0, max: 1, step: 0.5, genre: argumentative}
  score_specs: {}
  label_mapping: {Low: 0.0, Medium: 0.5, High: 1.0, low: 0.0, medium: 0.5, high: 1.0}
